<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SENTIDA Pastelería</title>
<style>
/* Flipbook — estilos del visor. Todo vive bajo .fb para no chocar con la página que lo contiene. */
.fb{
  --fb-bg:#30343d;
  --fb-ratio:.8;
  --fb-accent:#5a9eff;
  --fb-ink:#f7f8fb;
  --fb-muted:#aab1c1;
  --fb-chrome:color-mix(in srgb,var(--fb-bg) 40%,#000);
  --fb-btn:rgba(255,255,255,.09);
  --fb-btn-hover:rgba(255,255,255,.16);
  --fb-line:rgba(255,255,255,.07);
  position:relative;width:100%;height:100%;overflow:hidden;
  container-type:inline-size;
  display:grid;grid-template-rows:54px minmax(0,1fr) 58px;grid-template-columns:minmax(0,1fr);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--fb-ink);
  background:radial-gradient(ellipse at 50% 34%,
    color-mix(in srgb,var(--fb-bg) 88%,#fff) 0%,
    var(--fb-bg) 34%,
    color-mix(in srgb,var(--fb-bg) 67%,#000) 72%,
    color-mix(in srgb,var(--fb-bg) 50%,#000) 100%);
}
/* Fondo claro: textos y controles oscuros. */
.fb--light{
  --fb-ink:#15171c;
  --fb-muted:#5d6370;
  --fb-chrome:color-mix(in srgb,var(--fb-bg) 93%,#000);
  --fb-btn:rgba(0,0,0,.07);
  --fb-btn-hover:rgba(0,0,0,.12);
  --fb-line:rgba(0,0,0,.08);
}
.fb *{box-sizing:border-box}

.fb-bar{background:var(--fb-chrome);display:flex;align-items:center;gap:10px;padding:0 16px;z-index:50;min-width:0}
.fb-top{border-bottom:1px solid var(--fb-line)}
.fb-bottom{border-top:1px solid var(--fb-line);justify-content:space-between}
.fb-brand{display:flex;align-items:center;gap:10px;min-width:0;color:inherit;text-decoration:none}
.fb-logo{height:30px;width:auto;max-width:120px;object-fit:contain;flex:none;display:block}
.fb-titles{min-width:0}
.fb-title{font-size:.95rem;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-subtitle{font-size:.78rem;color:var(--fb-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-toolbar{display:flex;align-items:center;gap:7px;margin-left:auto;flex:none}
.fb button,.fb .fb-link{
  appearance:none;border:0;color:var(--fb-ink);background:var(--fb-btn);cursor:pointer;
  min-width:38px;height:36px;padding:0 12px;border-radius:18px;font:inherit;font-weight:650;font-size:.9rem;
  box-shadow:inset 0 0 0 1px var(--fb-line);
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap;
  transition:background .15s ease,transform .15s ease,opacity .15s ease;
}
.fb button:hover,.fb .fb-link:hover{background:var(--fb-btn-hover);transform:translateY(-1px)}
.fb button:disabled{opacity:.3;cursor:default;transform:none}
.fb button.fb-primary{background:linear-gradient(#67acff,#478df0);color:#fff}

.fb-viewer{position:relative;min-height:0;display:grid;grid-template-columns:90px minmax(0,1fr) 90px;align-items:center;overflow:hidden}
.fb-side{display:grid;place-items:center;height:100%;position:relative;z-index:5}
.fb button.fb-arrow{
  width:52px;height:52px;border-radius:50%;padding:0;font-size:1.65rem;
  box-shadow:0 12px 28px rgba(0,0,0,.18),inset 0 0 0 1px var(--fb-line)
}
.fb-stage{position:relative;height:100%;min-width:0;display:grid;place-items:center}

/* .fb-shift centra el libro cerrado (tapa / contratapa); el ancho y alto de .fb-book los calcula el JS. */
.fb-shift{
  position:relative;opacity:0;will-change:transform;
  transition:transform .55s cubic-bezier(.45,.05,.25,1),opacity .4s ease;
}
.fb-shift.fb-instant{transition:opacity .4s ease}
.fb--ready .fb-shift{opacity:1}
.fb-book{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none}
.fb-book .stf__wrapper{position:relative;width:100%;height:100%}
/* La sombra sigue la silueta real de las hojas, incluida la que está girando. */
.fb-book .stf__block{filter:drop-shadow(0 14px 20px rgba(0,0,0,.32)) drop-shadow(0 2px 3px rgba(0,0,0,.16))}

.fb-page{background:#fff;overflow:hidden}
.fb-page img{
  display:block;width:100%;height:100%;object-fit:contain;
  pointer-events:none;user-select:none;-webkit-user-drag:none
}
/* Sombra del lomo: cada página se oscurece suavemente hacia el pliegue central. */
.fb-page::after{content:"";position:absolute;inset:0;pointer-events:none}
.fb-page.--left::after{
  background:
    linear-gradient(to left,rgba(0,0,0,.22) 0%,rgba(0,0,0,.09) 3%,rgba(0,0,0,.03) 8%,rgba(0,0,0,0) 16%),
    linear-gradient(to right,rgba(0,0,0,.05),rgba(0,0,0,0) 2.5%);
}
.fb-page.--right::after{
  background:
    linear-gradient(to right,rgba(0,0,0,.22) 0%,rgba(0,0,0,.09) 3%,rgba(0,0,0,.03) 8%,rgba(0,0,0,0) 16%),
    linear-gradient(to left,rgba(0,0,0,.05),rgba(0,0,0,0) 2.5%);
}

.fb-loader{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .3s ease}
.fb--ready .fb-loader{opacity:0}
.fb-spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid var(--fb-line);border-top-color:var(--fb-accent);
  animation:fb-spin .8s linear infinite
}
@keyframes fb-spin{to{transform:rotate(360deg)}}

.fb-status{font-size:.85rem;color:var(--fb-muted);min-width:110px;flex:none;font-variant-numeric:tabular-nums}
.fb-thumbs{position:relative;display:flex;gap:5px;overflow:auto;min-width:0;flex:0 1 auto;max-width:min(70%,880px);padding:4px 2px;scrollbar-width:thin}
.fb-thumb{
  height:40px;aspect-ratio:var(--fb-ratio);flex:none;border-radius:3px;overflow:hidden;opacity:.5;cursor:pointer;
  background:#fff;border:1px solid var(--fb-line);transition:opacity .2s ease
}
.fb-thumb:hover{opacity:.8}
.fb-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fb-thumb.fb-active{opacity:1;outline:2px solid var(--fb-accent);outline-offset:1px}
.fb-thumb.fb-gap{margin-left:6px}
.fb-hint{font-size:.76rem;color:var(--fb-muted);margin-left:8px;white-space:nowrap}

@container (max-width:780px){
  .fb-viewer{grid-template-columns:50px minmax(0,1fr) 50px}
  .fb button.fb-arrow{width:42px;height:42px}
  .fb-subtitle,.fb-hint{display:none}
  .fb-bar{padding-inline:10px}
  .fb-bottom{justify-content:center}
  .fb-status{min-width:0}
}
@media (prefers-reduced-motion:reduce){.fb-shift{transition:opacity .4s ease}}

html,body{height:100%;margin:0;background:#16181d}#app{position:fixed;inset:0}
</style>
</head>

<script>
/*
 * Flipbook — visor de hojas con pliegue real.
 * Uso: const libro = Flipbook.mount(elementoRaiz, config)  →  { pageFlip, update(parcial), destroy() }
 * config: { title, subtitle, background, logo, link: {url, label}, pageWidth, pageHeight, pages, startPage }
 *   pages: rutas de imagen en orden; null = página en blanco.
 * Requiere visor/page-flip.browser.js (StPageFlip 2.0.7, MIT) y visor/flipbook.css.
 */
(function () {
  'use strict';

  const FLIP_MS = 480;       // duración de una vuelta completa (FlipHTML5 ronda los 0.4 s)
  const ARC = 0.06;          // cuánto "levanta" la mano la esquina a mitad de vuelta (fracción del alto)
  const CORNER_PEEK = 0.06;  // esquina que se levanta al pasar el mouse (fracción del ancho)

  const DEFAULTS = {
    title: '', subtitle: '', background: '#30343d', logo: null, link: null,
    pageWidth: 3, pageHeight: 4, pages: [], startPage: 0,
  };

  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function esc(value) {
    return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Fondo claro → textos oscuros. Umbral sobre la luminancia relativa (WCAG).
  function isLight(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return false;
    const n = parseInt(m[1], 16);
    const lin = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
    return .2126 * lin(n >> 16 & 255) + .7152 * lin(n >> 8 & 255) + .0722 * lin(n & 255) > .45;
  }

  // Pliegos en doble página: tapa sola a la derecha, pares, y la última sola si la cantidad es par.
  function spreadsFor(count) {
    const spreads = [[0]];
    for (let i = 1; i < count; i += 2) spreads.push(i + 1 < count ? [i, i + 1] : [i]);
    return spreads;
  }

  function topBar(cfg) {
    const url = cfg.link && cfg.link.url ? cfg.link.url : null;
    const brand = `${cfg.logo ? `<img class="fb-logo" src="${esc(cfg.logo)}" alt="">` : ''}
      <div class="fb-titles"><div class="fb-title">${esc(cfg.title)}</div>${cfg.subtitle ? `<div class="fb-subtitle">${esc(cfg.subtitle)}</div>` : ''}</div>`;
    return `
      <div class="fb-bar fb-top">
        ${url && cfg.logo
          ? `<a class="fb-brand" href="${esc(url)}" target="_blank" rel="noopener">${brand}</a>`
          : `<div class="fb-brand">${brand}</div>`}
        <div class="fb-toolbar">
          ${url ? `<a class="fb-link" href="${esc(url)}" target="_blank" rel="noopener">${esc(cfg.link.label || 'Ver más')} ↗</a>` : ''}
          <button type="button" data-fb="prev" aria-label="Página anterior">←</button>
          <button type="button" data-fb="next" class="fb-primary" aria-label="Página siguiente">→</button>
          <button type="button" data-fb="full" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
        </div>
      </div>`;
  }

  function template(cfg) {
    return `${topBar(cfg)}
      <div class="fb-viewer">
        <div class="fb-side"><button type="button" data-fb="prev" class="fb-arrow" aria-label="Página anterior">‹</button></div>
        <div class="fb-stage">
          <div class="fb-loader"><div class="fb-spinner"></div></div>
          <div class="fb-shift fb-instant"><div class="fb-book"></div></div>
        </div>
        <div class="fb-side"><button type="button" data-fb="next" class="fb-arrow" aria-label="Página siguiente">›</button></div>
      </div>
      <div class="fb-bar fb-bottom">
        <div class="fb-status"></div>
        <div class="fb-thumbs"></div>
        <div class="fb-hint">Arrastrá o hacé click en la hoja · ← → teclado</div>
      </div>`;
  }

  /* ---------- Movimiento: curvas de aceleración y trayectoria de mano sobre StPageFlip ---------- */
  function tuneMotion(fc, onTurnStart) {
    let grab = { x: 0, y: 0 };

    // Vuelta automática (click, flechas, teclado): arranca desde la esquina misma, sin salto inicial.
    fc.flip = function (globalPos) {
      if (this.app.getSettings().disableFlipByClick && !this.isPointOnCorners(globalPos)) return;
      if (this.calc !== null) this.render.finishAnimation();
      if (!this.start(globalPos)) return;
      const rect = this.getBoundsRect();
      const bottom = this.calc.getCorner() === 'bottom';
      const from = { x: rect.pageWidth - 1, y: bottom ? rect.height - 1 : 1 };
      this.setState('flipping');
      this.calc.calc(from);
      this.animateFlippingTo(from, { x: -rect.pageWidth, y: bottom ? rect.height : 0 }, true);
    };

    // Arrastre: la hoja se toma desde donde está el dedo, sin que la esquina salte hacia el puntero.
    fc.fold = function (globalPos) {
      const prev = this.state;
      if (prev === 'flipping') return;
      if (this.calc === null) {
        if (!this.start(globalPos)) return;   // no hay hoja para ese lado (tapa / contratapa)
        const rect = this.getBoundsRect();
        const p = this.render.convertToPage(globalPos);
        const cornerY = this.calc.getCorner() === 'bottom' ? rect.height : 0;
        grab = { x: rect.pageWidth - p.x, y: cornerY - p.y };
      } else if (prev === 'fold_corner') {
        grab = { x: 0, y: 0 };
      }
      this.setState('user_fold');
      const p = this.render.convertToPage(globalPos);
      this.do({ x: p.x + grab.x, y: p.y + grab.y });
    };

    const stopMove = fc.stopMove;
    fc.stopMove = function () {
      if (this.state === 'flipping') return;
      stopMove.call(this);
    };

    // Esquina que se levanta al pasar el mouse, proporcional al tamaño de la página.
    fc.showCorner = function (globalPos) {
      if (!this.checkState('read', 'fold_corner')) return;
      const rect = this.getBoundsRect();
      const pw = rect.pageWidth;
      if (this.isPointOnCorners(globalPos)) {
        if (this.calc === null) {
          if (!this.start(globalPos)) return;
          this.setState('fold_corner');
          const bottom = this.calc.getCorner() === 'bottom';
          const size = Math.max(18, pw * CORNER_PEEK);
          const from = { x: pw - 1, y: bottom ? rect.height - 1 : 1 };
          this.calc.calc(from);
          this.animateFlippingTo(from, { x: pw - size, y: bottom ? rect.height - size * .9 : size * .9 }, false, false);
        } else {
          this.do(this.render.convertToPage(globalPos));
        }
      } else {
        this.setState('read');
        this.render.finishAnimation();
        this.stopMove();
      }
    };

    fc.animateFlippingTo = function (start, dest, isTurned, needReset = true) {
      if (!this.calc) return;
      const rect = this.getBoundsRect();
      const auto = this.state === 'flipping';
      const bottom = this.calc.getCorner() === 'bottom';
      const dist = Math.hypot(dest.x - start.x, dest.y - start.y);

      let duration, ease, arc = 0;
      if (!needReset) {                       // esquina al pasar el mouse
        duration = 260; ease = easeOut;
      } else if (auto) {                      // vuelta completa: acelera, cruza y se asienta
        duration = FLIP_MS; ease = easeInOut;
        arc = rect.height * ARC * (bottom ? -1 : 1);
      } else {                                // al soltar: sigue con la inercia y frena
        duration = Math.min(FLIP_MS, Math.max(170, FLIP_MS * 1.1 * dist / (2 * rect.pageWidth)));
        ease = easeOut;
      }

      if (needReset) {
        const cur = this.app.getPageCollection().getCurrentSpreadIndex();
        const dir = this.calc.getDirection();   // 0 = adelante, 1 = atrás
        onTurnStart(isTurned ? cur + (dir === 0 ? 1 : -1) : cur);
      }

      const n = Math.max(2, Math.round(duration / 16.7));
      const frames = [];
      for (let i = 1; i <= n; i++) {
        const e = ease(i / n);
        const pt = {
          x: start.x + (dest.x - start.x) * e,
          y: start.y + (dest.y - start.y) * e + arc * Math.sin(Math.PI * e),
        };
        frames.push(() => this.do(pt));
      }

      this.render.startAnimation(frames, duration, () => {
        if (!this.calc) return;
        if (isTurned) {
          if (this.calc.getDirection() === 1) this.app.turnToPrevPage();
          else this.app.turnToNextPage();
        }
        if (needReset) {
          this.render.setBottomPage(null);
          this.render.setFlippingPage(null);
          this.render.clearShadow();
          this.setState('read');
          this.reset();
        }
      });
    };
  }

  function mount(root, config) {
    if (!window.St || !window.St.PageFlip) throw new Error('Flipbook: falta visor/page-flip.browser.js');

    const cfg = Object.assign({}, DEFAULTS, config);
    const pages = cfg.pages || [];
    const count = pages.length;
    const ratio = cfg.pageWidth / cfg.pageHeight;
    const spreads = spreadsFor(count);
    const cleanups = [];
    const listen = (target, type, fn, opts) => {
      target.addEventListener(type, fn, opts);
      cleanups.push(() => target.removeEventListener(type, fn, opts));
    };

    function applyTheme() {
      root.classList.toggle('fb--light', isLight(cfg.background));
      root.style.setProperty('--fb-bg', cfg.background);
    }

    root.classList.add('fb');
    root.style.setProperty('--fb-ratio', String(ratio));
    applyTheme();
    root.innerHTML = template(cfg);

    const $ = sel => root.querySelector(sel);
    const stage = $('.fb-stage'), shift = $('.fb-shift'), bookEl = $('.fb-book');
    const statusEl = $('.fb-status'), thumbsEl = $('.fb-thumbs');
    let pageW = 0, portrait = false, pending = null, destroyed = false;

    function unmount() {
      root.innerHTML = '';
      root.classList.remove('fb', 'fb--light', 'fb--ready');
      root.style.removeProperty('--fb-bg');
      root.style.removeProperty('--fb-ratio');
    }

    if (!count) {
      root.classList.add('fb--ready');
      return { pageFlip: null, update() {}, destroy: unmount };
    }

    pages.forEach((src, i) => {
      const page = document.createElement('div');
      page.className = 'fb-page';
      if (src) page.innerHTML = `<img src="${esc(src)}" alt="Página ${i + 1}" draggable="false" decoding="async">`;
      bookEl.appendChild(page);
    });

    function measure() {
      const r = stage.getBoundingClientRect();
      const pad = r.width < 700 ? 14 : 34;
      const availW = Math.max(120, r.width - pad * 2), availH = Math.max(150, r.height - pad * 2);
      const twoUp = Math.min(availW / 2, availH * ratio);
      const oneUp = Math.min(availW, availH * ratio);
      // Una sola página cuando el pliego doble dejaría las páginas chicas de verdad (celular o tablet vertical).
      portrait = twoUp < oneUp * 0.62 && twoUp < 340;
      pageW = Math.max(40, Math.floor(portrait ? oneUp : twoUp));
      bookEl.style.width = (portrait ? pageW : pageW * 2) + 'px';
      bookEl.style.height = Math.round(pageW / ratio) + 'px';
    }

    function spreadShift(spreadIndex) {
      if (portrait) return 0;
      const s = spreads[spreadIndex];
      if (!s || s.length === 2) return 0;
      return s[0] === 0 ? -pageW / 2 : pageW / 2;   // libro cerrado: centrado en pantalla
    }
    function setShift(spreadIndex, animate) {
      shift.classList.toggle('fb-instant', !animate);
      shift.style.transform = `translateX(${spreadShift(spreadIndex)}px)`;
    }

    measure();

    const pageFlip = new St.PageFlip(bookEl, {
      width: cfg.pageWidth, height: cfg.pageHeight,
      size: 'stretch',
      minWidth: pageW * 0.75, maxWidth: 10000, minHeight: 50, maxHeight: 10000,
      autoSize: false,
      showCover: true,
      usePortrait: true,
      drawShadow: true,
      maxShadowOpacity: 0.5,
      flippingTime: FLIP_MS,
      showPageCorners: true,
      mobileScrollSupport: false,
      swipeDistance: 30,
      startPage: Math.min(Math.max(0, cfg.startPage | 0), count - 1),
    });
    pageFlip.loadFromHTML(bookEl.querySelectorAll('.fb-page'));
    bookEl.style.minWidth = bookEl.style.minHeight = '';

    // La tapa y la contratapa son papel, no cartón: se pliegan igual que el resto.
    pageFlip.getPageCollection().getPages().forEach(p => p.setDensity('soft'));
    tuneMotion(pageFlip.getFlipController(), target => { if (!portrait) setShift(target, true); });

    /* ---------- Interfaz ---------- */
    pages.forEach((src, i) => {
      const t = document.createElement('div');
      t.className = 'fb-thumb' + (i % 2 === 1 ? ' fb-gap' : '');
      if (src) t.innerHTML = `<img src="${esc(src)}" alt="" loading="lazy">`;
      t.addEventListener('click', () => goTo(i));
      thumbsEl.appendChild(t);
    });

    function currentSpread() {
      return pageFlip.getPageCollection().getCurrentSpreadIndex();
    }
    function visiblePages() {
      const idx = pageFlip.getCurrentPageIndex();
      return portrait ? [idx] : spreads[currentSpread()] || [idx];
    }

    function updateUI() {
      const vis = visiblePages();
      const first = vis[0], last = vis[vis.length - 1];
      statusEl.textContent = (first === 0 && !portrait ? 'Tapa' : vis.map(i => i + 1).join('–')) + ` / ${count}`;
      root.querySelectorAll('[data-fb=prev]').forEach(b => { b.disabled = first === 0; });
      root.querySelectorAll('[data-fb=next]').forEach(b => { b.disabled = last === count - 1; });
      thumbsEl.querySelectorAll('.fb-thumb').forEach((t, i) => t.classList.toggle('fb-active', vis.includes(i)));
      // Solo desplaza la tira de miniaturas (scrollIntoView movería toda la página).
      const active = thumbsEl.querySelector('.fb-thumb.fb-active');
      if (active) {
        const l = active.offsetLeft, r = l + active.offsetWidth * vis.length;
        if (l < thumbsEl.scrollLeft) thumbsEl.scrollLeft = l - 8;
        else if (r > thumbsEl.scrollLeft + thumbsEl.clientWidth) thumbsEl.scrollLeft = r - thumbsEl.clientWidth + 8;
      }
    }

    function busy() {
      const s = pageFlip.getState();
      return s === 'flipping' || s === 'user_fold';
    }
    function go(dir) {
      if (busy()) { pending = dir; return; }
      if (dir > 0) pageFlip.flipNext('bottom'); else pageFlip.flipPrev('bottom');
    }
    function goTo(pageIndex) {
      if (busy() || visiblePages().includes(pageIndex)) return;
      pageFlip.flip(pageIndex, 'bottom');
    }

    pageFlip.on('flip', () => { updateUI(); setShift(currentSpread(), true); });
    pageFlip.on('changeOrientation', () => { updateUI(); setShift(currentSpread(), false); });
    pageFlip.on('changeState', e => {
      if (e.data === 'read' && pending !== null) {
        const dir = pending;
        pending = null;
        setTimeout(() => { if (!destroyed) go(dir); }, 0);
      }
    });

    listen(root, 'click', e => {
      const b = e.target.closest('[data-fb]');
      if (!b || !root.contains(b) || b.disabled) return;
      if (b.dataset.fb === 'next') go(1);
      else if (b.dataset.fb === 'prev') go(-1);
      else if (b.dataset.fb === 'full') {
        if (!document.fullscreenElement) root.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
    });
    listen(document, 'keydown', e => {
      const t = e.target;
      if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') go(1);
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
      else if (e.key === 'Home') goTo(0);
      else if (e.key === 'End') goTo(count - 1);
    });

    function relayout() {
      if (destroyed) return;
      measure();
      pageFlip.getSettings().minWidth = pageW * 0.75;   // decide doble página / página simple
      pageFlip.update();
      setShift(currentSpread(), false);
      updateUI();
    }
    let raf = 0;
    const ro = new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(relayout); });
    ro.observe(stage);
    cleanups.push(() => { ro.disconnect(); cancelAnimationFrame(raf); });
    relayout();

    // Mostrar el libro cuando las primeras páginas están decodificadas (evita el parpadeo en blanco).
    const imgs = [...bookEl.querySelectorAll('img')];
    const firstOnes = imgs.slice(0, 3).map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve());
    Promise.race([Promise.all(firstOnes), new Promise(r => setTimeout(r, 2500))]).then(() => {
      if (destroyed) return;
      requestAnimationFrame(() => {
        if (destroyed) return;
        shift.classList.remove('fb-instant');
        root.classList.add('fb--ready');
      });
    });

    return {
      pageFlip,
      // Cambia textos, colores, logo y link sin rearmar el libro.
      update(partial) {
        if (destroyed) return;
        Object.assign(cfg, partial);
        applyTheme();
        $('.fb-top').outerHTML = topBar(cfg);
        updateUI();
      },
      destroy() {
        if (destroyed) return;
        destroyed = true;
        cleanups.forEach(fn => fn());
        const render = pageFlip.getRender();
        try { pageFlip.destroy(); } catch (err) { /* ya estaba desmontado */ }
        render.render = () => {};   // StPageFlip no corta su bucle de requestAnimationFrame: lo dejamos sin trabajo
        unmount();
      },
    };
  }

  window.Flipbook = { mount, version: '1.0.0' };
})();

</script>
<script>window.flipbook = Flipbook.mount(document.getElementById('app'), window.FLIPBOOK);</script>
</body>
</html>
